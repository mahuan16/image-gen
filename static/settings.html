<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio · Settings</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="shell">
        <header>
            <div class="wordmark">
                RunningHub
                <span>settings</span>
            </div>
            <div class="header-right">
                <div class="status-pill">
                    <span class="dot"></span>
                    <span id="status-label">connected</span>
                </div>
                <a href="index.html"><button id="clear-btn">← back</button></a>
            </div>
        </header>

        <div id="settings-body">
            <div class="section-row">
                <p class="section-label">MCP Servers</p>
                <button class="add-btn" id="add-btn">+ add server</button>
            </div>

            <div class="server-list" id="server-list">
                <p class="settings-loading">loading servers…</p>
            </div>

            <!-- Add server modal -->
            <div class="modal-overlay" id="modal-overlay">
                <div class="modal">
                    <p class="modal-title">add mcp server</p>

                    <label class="field-label">name</label>
                    <input class="field-input" id="new-name" type="text" placeholder="e.g. Image Generation" />

                    <label class="field-label">url</label>
                    <input class="field-input" id="new-url" type="text" placeholder="http://localhost:8003/sse" />

                    <label class="field-label">instructions <span class="field-optional">(optional)</span></label>
                    <textarea class="field-input field-textarea" id="new-instruct" rows="3" placeholder="Describe what this server does and when to use its tools…"></textarea>

                    <p class="modal-error" id="modal-error"></p>

                    <div class="modal-actions">
                        <button class="modal-cancel" id="modal-cancel">cancel</button>
                        <button class="modal-confirm" id="modal-confirm">add server</button>
                    </div>
                </div>
            </div>

            <div class="reload-notice" id="reload-notice">
                ⚠ changes take effect after the agent restarts.
            </div>
            <button class="apply-btn" id="apply-btn">apply &amp; restart agent</button>
        </div>
    </div>

    <script src="settings.js"></script>
</body>
</html>
